<svg xmlns="http://www.w3.org/2000/svg" width="800" height="657" viewBox="0 0 800 657" role="img" aria-labelledby="title desc">
  <title id="title">Order flow, arbitrage and validator settlement</title>
  <desc id="desc">Ordinary RPC traffic tries the TEE first and may fall back to validators. Searchers read published SubBlocks and submit bundles. A validator checks a complete candidate with the permit proof, or builds locally after expiry. Fee policy follows the source block.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536a6c"/></marker></defs>
  <rect width="800" height="657" rx="12" fill="#fcfdfb"/>
  <rect x="24" y="16" width="367" height="85" rx="9" fill="#E9EEF9" stroke="#97A8CE" stroke-width="1.5"/>
  <text x="40" y="43" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Wallet via node RPC</text>
  <text x="40" y="67" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Ordinary flow tries the TEE first.</text>
  <text x="40" y="88" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Private RPC submissions fail closed.</text>
  <rect x="409" y="16" width="367" height="85" rx="9" fill="#E9EEF9" stroke="#97A8CE" stroke-width="1.5"/>
  <text x="425" y="43" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Searcher or direct client</text>
  <text x="425" y="67" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Pin the registered TLS key.</text>
  <text x="425" y="88" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Submit signed transactions or a bundle.</text>
  <polyline points="315,101 315,140" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="600,101 600,140" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="208" y="143" width="568" height="86" rx="9" fill="#E0F1ED" stroke="#74A99F" stroke-width="1.5"/>
  <text x="224" y="170" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">TEE Gateway admits and orders</text>
  <text x="224" y="194" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Simulate bundles and screen configured pools.</text>
  <text x="224" y="215" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Rank eligible items while preserving the published prefix.</text>
  <polyline points="600,229 600,252" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="409" y="255" width="367" height="87" rx="9" fill="#E0F1ED" stroke="#74A99F" stroke-width="1.5"/>
  <text x="425" y="282" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Signed SubBlocks</text>
  <text x="425" y="306" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Publish ordered chunks on a 20/50 ms tick.</text>
  <text x="425" y="327" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Searchers can backrun a published trade.</text>
  <rect x="24" y="255" width="367" height="87" rx="9" fill="#F1F5F5" stroke="#ACBBBD" stroke-width="1.5"/>
  <text x="40" y="282" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Direct validator forwarding</text>
  <text x="40" y="306" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">If Gateway submission fails, forward</text>
  <text x="40" y="327" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">ordinary transactions to validators.</text>
  <polyline points="82,101 82,252" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="600,342 600,370" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="207,342 207,370" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="409" y="373" width="367" height="86" rx="9" fill="#E0F1ED" stroke="#74A99F" stroke-width="1.5"/>
  <text x="425" y="400" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Complete Gateway candidate</text>
  <text x="425" y="424" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Append signed permit + acknowledgement</text>
  <text x="425" y="445" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">as the last transaction, to 0x3002.</text>
  <rect x="24" y="373" width="367" height="86" rx="9" fill="#F1F5F5" stroke="#ACBBBD" stroke-width="1.5"/>
  <text x="40" y="400" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Local validator candidate</text>
  <text x="40" y="424" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">With an outstanding permit, wait for its</text>
  <text x="40" y="445" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">original deadline before building locally.</text>
  <polyline points="207,459 207,485" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="600,459 600,485" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="488" width="752" height="67" rx="9" fill="#FFF2CE" stroke="#CCA650" stroke-width="1.5"/>
  <text x="40" y="515" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Validator checks, seals and broadcasts</text>
  <text x="40" y="539" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Check body, nonces, gas reservations and any permit proof. An invalid carrier rejects the block.</text>
  <polyline points="400,555 400,581" stroke="#536a6c" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="584" width="752" height="60" rx="9" fill="#FFF2CE" stroke="#CCA650" stroke-width="1.5"/>
  <text x="40" y="611" fill="#233436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Chain settles protocol fees under the source block’s epoch policy</text>
</svg>
