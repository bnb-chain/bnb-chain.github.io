<svg xmlns="http://www.w3.org/2000/svg" width="840" height="299" viewBox="0 0 840 299" role="img" aria-labelledby="title desc">
  <title id="title">Hard reservations in 100 units of user gas</title>
  <desc id="desc">30 units belong to Payment, 20 to Privacy, and 50 are shared. Only General and lane excess compete for the shared gas.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536a6c"/></marker></defs>
  <rect width="100%" height="100%" rx="12" fill="#fcfdfb"/>
  <text x="24" y="38" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">User gas after the system allowance</text>
  <text x="24" y="66" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Example with 100 units of user gas</text>
  <rect x="24" y="88" width="236" height="58" rx="8" fill="#e0f1ed" stroke="#72aaa0" stroke-width="1.5"/>
  <text x="142.0" y="124" text-anchor="middle" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Payment · 30</text>
  <rect x="264" y="88" width="156" height="58" rx="8" fill="#e9eef9" stroke="#96a7cf" stroke-width="1.5"/>
  <text x="342.0" y="124" text-anchor="middle" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Privacy · 20</text>
  <rect x="424" y="88" width="392" height="58" rx="8" fill="#fff2ce" stroke="#d7ac52" stroke-width="1.5"/>
  <text x="620.0" y="124" text-anchor="middle" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Public · 50</text>
  <text x="24" y="189" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">If both lanes are idle</text>
  <text x="24" y="216" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">General can use 50 units. The 30 and 20 stay reserved.</text>
  <text x="24" y="253" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">If Payment uses 70 units</text>
  <text x="24" y="280" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Payment takes its 30 plus 40 public units. Privacy keeps 20 and 10 remain public.</text>
</svg>
