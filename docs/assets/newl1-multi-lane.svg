<svg xmlns="http://www.w3.org/2000/svg" width="840" height="295" viewBox="0 0 840 295" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Lane gas reservations</title>
  <desc id="desc">30 units belong to Payment, 20 to Privacy, and 50 are shared. Only General and lane excess compete for the shared gas.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .label { font-size: 16px; font-weight: bold; }
    .body { font-size: 15px; }
    .caption { font-size: 15px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="840" height="295" fill="#ffffff" />
  <text x="420" y="32" text-anchor="middle" class="title">Multi-Lane gas reservations</text>
  <text x="420" y="56" text-anchor="middle" class="subtitle">Example allocation of 100 units after the system gas allowance</text>
  <g transform="translate(0 -4)">
    <rect x="24" y="88" width="236" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
    <text x="142.0" y="122.0" text-anchor="middle" class="label">Payment · 30</text>
    <rect x="264" y="88" width="156" height="58" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="342.0" y="122.0" text-anchor="middle" class="label">Privacy · 20</text>
    <rect x="424" y="88" width="392" height="58" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
    <text x="620.0" y="122.0" text-anchor="middle" class="label">Public · 50</text>
    <text x="24" y="189" text-anchor="start" class="label">If both lanes are idle</text>
    <text x="24" y="216" text-anchor="start" class="caption">General can use 50 units. The 30 and 20 stay reserved.</text>
    <text x="24" y="253" text-anchor="start" class="label">If Payment uses 70 units</text>
    <text x="24" y="280" text-anchor="start" class="caption">Payment takes its 30 plus 40 public units. Privacy keeps 20 and 10 remain public.</text>
  </g>
</svg>
