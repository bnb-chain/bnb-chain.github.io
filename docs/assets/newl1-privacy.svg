<svg xmlns="http://www.w3.org/2000/svg" width="840" height="482" viewBox="0 0 840 482" role="img" aria-labelledby="title desc">
  <title id="title">From deposit to shielded spend</title>
  <desc id="desc">A deposit is queued, promoted at maturity, and inserted into the tree. The wallet proves a spend from the finalized leaf. The pool verifies it and settles the outputs.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .label { font-size: 16px; font-weight: bold; }
    .body { font-size: 15px; }
    .caption { font-size: 15px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="840" height="482" fill="#ffffff" />
  <text x="420" y="32" text-anchor="middle" class="title">From deposit to shielded spend</text>
  <text x="420" y="56" text-anchor="middle" class="subtitle">Deposit maturity, tree insertion and settlement</text>
  <g transform="translate(0 70)">
    <rect x="18" y="24" width="242" height="96" rx="9" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
    <text x="139.0" y="57.0" text-anchor="middle" class="label">DepositQueued</text>
    <text x="139.0" y="77.0" text-anchor="middle" class="body">Public deposit ID, amount,</text>
    <text x="139.0" y="97.0" text-anchor="middle" class="body">asset and maturity time</text>
    <rect x="299" y="24" width="242" height="96" rx="9" fill="#eef6ff" stroke="#6c8ebf" stroke-width="2" />
    <text x="420.0" y="57.0" text-anchor="middle" class="label">DepositPromoted</text>
    <text x="420.0" y="77.0" text-anchor="middle" class="body">Mature note receives its</text>
    <text x="420.0" y="97.0" text-anchor="middle" class="body">insertion queue index</text>
    <rect x="580" y="24" width="242" height="96" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
    <text x="701.0" y="57.0" text-anchor="middle" class="label">NoteInserted</text>
    <text x="701.0" y="77.0" text-anchor="middle" class="body">Commitment receives its</text>
    <text x="701.0" y="97.0" text-anchor="middle" class="body">Merkle tree leaf position</text>
    <rect x="18" y="177" width="370" height="94" rx="9" fill="#f1f8ee" stroke="#82b366" stroke-width="2" />
    <text x="203.0" y="209.0" text-anchor="middle" class="label">PrivacyPool verifies the spend</text>
    <text x="203.0" y="229.0" text-anchor="middle" class="body">Check proof and program, then consume</text>
    <text x="203.0" y="249.0" text-anchor="middle" class="body">accepted nullifiers and replay IDs</text>
    <rect x="450" y="177" width="372" height="94" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="636.0" y="209.0" text-anchor="middle" class="label">Wallet constructs a proof</text>
    <text x="636.0" y="229.0" text-anchor="middle" class="body">Use finalized insertion, tree path,</text>
    <text x="636.0" y="249.0" text-anchor="middle" class="body">note secrets and registered program</text>
    <rect x="18" y="332" width="242" height="66" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
    <text x="139.0" y="360.0" text-anchor="middle" class="label">Shielded transfer</text>
    <text x="139.0" y="380.0" text-anchor="middle" class="body">New note commitments</text>
    <rect x="299" y="332" width="242" height="66" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
    <text x="420.0" y="360.0" text-anchor="middle" class="label">Public withdrawal</text>
    <text x="420.0" y="380.0" text-anchor="middle" class="body">Public asset payout</text>
    <rect x="580" y="332" width="242" height="66" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="701.0" y="360.0" text-anchor="middle" class="label">AtomicCall</text>
    <text x="701.0" y="380.0" text-anchor="middle" class="body">Proceeds or refund Open Note</text>
    <polyline points="260,73 296,73" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="541,73 577,73" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="701,120 701,174" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="450,223 391,223" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="140,271 140,329" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="204,271 204,301 420,301 420,329" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="267,271 267,288 701,288 701,329" fill="none" stroke="#4b5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
  </g>
</svg>
