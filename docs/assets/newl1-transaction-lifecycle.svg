<svg xmlns="http://www.w3.org/2000/svg" width="840" height="518" viewBox="0 0 840 518" role="img" aria-labelledby="title desc">
  <title id="title">Transaction lifecycle</title>
  <desc id="desc">Ordinary submissions can use validator forwarding. Private submissions require Gateway admission. Canonical ordering leads to separate execution and order-finality signals.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536a6c"/></marker></defs>
  <rect width="100%" height="100%" rx="12" fill="#fcfdfb"/>
  <rect x="18" y="20" width="386" height="87" rx="8" fill="#f2f5f5" stroke="#b3c1c2" stroke-width="1.5"/>
  <text x="34" y="49" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Ordinary RPC submission</text>
  <text x="34" y="74" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Local pool can park or admit for packing.</text>
  <text x="34" y="96" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Ordinary traffic may use validator forwarding.</text>
  <rect x="436" y="20" width="386" height="87" rx="8" fill="#e9eef9" stroke="#96a7cf" stroke-width="1.5"/>
  <text x="452" y="49" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Private submission or bundle</text>
  <text x="452" y="74" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Requires an authenticated Gateway.</text>
  <text x="452" y="96" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">On failure, the request returns an error.</text>
  <rect x="18" y="157" width="386" height="81" rx="8" fill="#f2f5f5" stroke="#b3c1c2" stroke-width="1.5"/>
  <text x="34" y="186" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Local validator production</text>
  <text x="34" y="211" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Pack eligible transactions after any issued</text>
  <text x="34" y="233" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">permit expires.</text>
  <rect x="436" y="157" width="386" height="81" rx="8" fill="#e0f1ed" stroke="#72aaa0" stroke-width="1.5"/>
  <text x="452" y="186" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Delegated Gateway ordering</text>
  <text x="452" y="211" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Optional signed SubBlocks show a prefix.</text>
  <text x="452" y="233" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">The validator checks the complete candidate.</text>
  <polyline points="116,107 116,154" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="335,107 335,130 496,130 496,154" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="664,107 664,154" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="228" y="270" width="384" height="74" rx="8" fill="#fff2ce" stroke="#d7ac52" stroke-width="1.5"/>
  <text x="244" y="299" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Ordered in a canonical block</text>
  <text x="244" y="324" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Check the block hash and transaction position.</text>
  <polyline points="207,238 207,302 225,302" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="635,238 635,302 615,302" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="18" y="378" width="386" height="75" rx="8" fill="#f2f5f5" stroke="#b3c1c2" stroke-width="1.5"/>
  <text x="34" y="407" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Executed</text>
  <text x="34" y="432" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Check the receipt for success or failure.</text>
  <rect x="436" y="378" width="386" height="75" rx="8" fill="#f2f5f5" stroke="#b3c1c2" stroke-width="1.5"/>
  <text x="452" y="407" text-anchor="start" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Order-finalized</text>
  <text x="452" y="432" text-anchor="start" fill="#41565a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Consensus finalizes the containing block.</text>
  <polyline points="340,344 340,359 211,359 211,375" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="500,344 500,359 629,359 629,375" fill="none" stroke="#536a6c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="18" y="474" width="804" height="38" rx="8" fill="#e0f1ed" stroke="#72aaa0" stroke-width="1.5"/>
  <text x="420" y="499" text-anchor="middle" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Execution-finalized: a later finalized block commits the result. Recheck the canonical receipt.</text>
</svg>
