<svg xmlns="http://www.w3.org/2000/svg" width="800" height="675" viewBox="0 0 800 675" role="img" aria-labelledby="title desc">
  <title id="title">Shielded payment lifecycle</title>
  <desc id="desc">The wallet identifies finalized notes and proves a spend locally. An aggregator wraps compatible leaf proofs and a payer submits a batch. After verification an eligible member creates shielded outputs or pays a public recipient. Emergency EXIT has an independent one-member wrapper path.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .label { font-size: 16px; font-weight: bold; }
    .body { font-size: 15px; }
    .caption { font-size: 15px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="800" height="675" fill="#ffffff" />
  <text x="400" y="32" text-anchor="middle" class="title">Shielded payment lifecycle</text>
  <text x="400" y="56" text-anchor="middle" class="subtitle">Wallet, proof aggregation and on-chain settlement during the PQ migration</text>
  <g transform="translate(0 70)">
    <rect x="24" y="18" width="752" height="66" rx="9" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
    <text x="400.0" y="46.0" text-anchor="middle" class="label">Fund and scan the wallet</text>
    <text x="400.0" y="66.0" text-anchor="middle" class="body">Deposit native BNB or an admitted BEP-20 token, or receive shielded outputs. Wait for finalized insertion.</text>
    <rect x="24" y="107" width="752" height="66" rx="9" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
    <text x="400.0" y="135.0" text-anchor="middle" class="label">Wallet chooses notes and creates a leaf proof</text>
    <text x="400.0" y="155.0" text-anchor="middle" class="body">Bind nullifiers, outputs, fees and any public payout. Keep spending secrets and paths local.</text>
    <rect x="24" y="204" width="368" height="102" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="208.0" y="230.0" text-anchor="middle" class="label">Ordinary aggregation</text>
    <text x="208.0" y="250.0" text-anchor="middle" class="body">Combine compatible user proofs.</text>
    <text x="208.0" y="270.0" text-anchor="middle" class="body">Use the temporary Groth16 wrapper.</text>
    <text x="208.0" y="290.0" text-anchor="middle" class="body">Submit via applyBatch or native V1.</text>
    <rect x="408" y="204" width="368" height="102" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="592.0" y="230.0" text-anchor="middle" class="label">Emergency EXIT</text>
    <text x="592.0" y="250.0" text-anchor="middle" class="body">Use a single EXIT proof.</text>
    <text x="592.0" y="270.0" text-anchor="middle" class="body">Independent wrapper or self-wrap.</text>
    <text x="592.0" y="290.0" text-anchor="middle" class="body">Submit a note-funded native V2.</text>
    <rect x="24" y="336" width="752" height="76" rx="9" fill="#f1f8ee" stroke="#82b366" stroke-width="2" />
    <text x="400.0" y="369.0" text-anchor="middle" class="label">PrivacyPool verifies and settles</text>
    <text x="400.0" y="389.0" text-anchor="middle" class="body">Check program, proof, root and policy. Consume each applied member once.</text>
    <rect x="24" y="444" width="368" height="86" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
    <text x="208.0" y="472.0" text-anchor="middle" class="label">Shielded transfer or consolidation</text>
    <text x="208.0" y="492.0" text-anchor="middle" class="body">Queue the new commitments. Scan and</text>
    <text x="208.0" y="512.0" text-anchor="middle" class="body">verify the output at its finalized leaf.</text>
    <rect x="408" y="444" width="368" height="86" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
    <text x="592.0" y="472.0" text-anchor="middle" class="label">Withdrawal or EXIT</text>
    <text x="592.0" y="492.0" text-anchor="middle" class="body">Pay the disclosed recipient. A recoverable</text>
    <text x="592.0" y="512.0" text-anchor="middle" class="body">payout failure leaves claimable credit.</text>
    <text x="400" y="573" text-anchor="middle" class="label">Check the member outcome and the finalized chain before updating the wallet balance.</text>
    <polyline points="400,84 400,104" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="208,173 208,201" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="592,173 592,201" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="208,306 208,333" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="592,306 592,333" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="208,412 208,441" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
    <polyline points="592,412 592,441" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" />
  </g>
</svg>
