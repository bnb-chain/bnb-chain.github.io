name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
          pip install mkdocs-video
          pip install mkdocs-redirects
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-awesome-pages-plugin==2.10.1
          pip install markdownify==1.2.3

      - name: Test Markdown exports
        run: python -m unittest discover -s tests -v

      - name: Build MkDocs site
        run: mkdocs build

      - name: Check agent resource coverage
        run: python scripts/check_agent_docs.py site

      - name: Check documentation links
        run: python scripts/check_doc_links.py site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: docs.bnbchain.org